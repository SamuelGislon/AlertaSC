services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: alertasc_dev
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - alertasc-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d alertasc_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  alertasc-postgres:
